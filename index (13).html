<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Client</title>
  <style>
    body { font-family: sans-serif; text-align: center; background: #1a1a1a; color: white; margin: 0; padding: 20px; }
    canvas { background: #333; border: 2px solid #fff; display: block; margin: 20px auto; }
    .controls { margin-bottom: 10px; }
    input, button { padding: 8px 12px; margin: 5px; border-radius: 4px; border: none; }
    button { background: #007bff; color: white; cursor: pointer; }
  </style>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>
  <h1>Unblocked Multiplayer Arena</h1>
  
  <div class="controls">
    <input type="text" id="username" placeholder="Username" value="Player1">
    <input type="text" id="roomId" placeholder="Room ID" value="room1">
    <button onclick="connectToGame()">Join Game</button>
  </div>

  <canvas id="gameCanvas" width="800" height="500"></canvas>

  <script src="app.js"></script>
</body>
</html>
